name: Sync org repositories

# The scheduled run is always report-only (dry-run): it never modifies a repo
# or opens a PR, it just logs what would change. To actually apply, trigger it
# manually from the Actions tab and untick "Report changes without applying".
on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report changes without applying them'
        type: boolean
        default: true

concurrency:
  group: org-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # 2.37.2
        with:
          php-version: '8.5'
          coverage: none

      - name: Install dependencies
        run: composer install --no-dev --no-interaction --prefer-dist

      # Mints a short-lived installation token scoped to the App's repos.
      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ secrets.MAHO_ORGANIZATION_CONTROLLER_CLIENT_ID }}
          private-key: ${{ secrets.MAHO_ORGANIZATION_CONTROLLER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      # Scheduled runs are forced to dry-run; only a manual dispatch with the
      # box unticked applies changes.
      - name: Run sync
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: php sync.php ${{ (github.event_name == 'schedule' || inputs.dry_run) && '--dry-run' || '' }}
